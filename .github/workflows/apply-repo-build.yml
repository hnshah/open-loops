name: apply-repo-build

on:
  push:
    branches:
      - flesh-out-repo-v0.2.0

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply repository tree
        run: |
          cat .repo-build/chunk-* > /tmp/open-loops-tree.b64
          base64 -d /tmp/open-loops-tree.b64 > /tmp/open-loops-tree.tar.gz
          tar -xzf /tmp/open-loops-tree.tar.gz -C .
          rm -rf .repo-build
          rm -f .github/workflows/apply-repo-build.yml

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate repository
        run: |
          python3 scripts/validate_repo.py
          python3 scripts/check_portability.py
          python3 evals/validate_triggers.py
          python3 evals/validate_cases.py
          python3 scripts/package_skill.py --check
          python3 -m compileall -q scripts evals

      - name: Commit v0.2.0 tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Flesh out Open Loops repo v0.2.0"
          git push
