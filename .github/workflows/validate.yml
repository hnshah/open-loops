name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/validate_repo.py
      - run: python3 scripts/check_portability.py
      - run: python3 evals/validate_triggers.py
      - run: python3 evals/validate_cases.py
      - run: python3 evals/validate_human_reviews.py
      - run: python3 evals/validate_rankings.py
      - run: python3 evals/validate_pairwise.py
      - run: python3 evals/test_calibrated_scorer.py
      - run: python3 evals/export_blind_cases.py > /tmp/open-loops-blind-cases.jsonl && test "$(wc -l < /tmp/open-loops-blind-cases.jsonl)" -eq 64
      - run: python3 evals/run_claude_blind.py --help > /dev/null
      - run: python3 evals/merge_prediction_sets.py --help > /dev/null
      - run: bash -n evals/run_claude_compare.sh
      - run: python3 scripts/package_skill.py --check
      - run: python3 -m compileall -q scripts evals
